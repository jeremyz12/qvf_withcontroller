", "speaker": "John"}, {"value": "blogging about politics", "date": "2023-04-18", "span": "I've been blogging about politics and the government", "turn": "Hey Maria, hope you're doing okay. Since we chatted last, I've been blogging about politics and the government. It's been a really satisfying experience and I care about making a real impact. We need way better education and infrastructure and I know firsthand how this impacts neighborhoods.", "speaker": "John"}, {"value": "decided to run for office again", "date": "2023-05-06", "span": "I decided to run for office again", "turn": "Hey Maria, great to chat again! A lot has happened since we last spoke. Last week, I decided to run for office again - even though I haven't been successful before. I guess I can't let go of my dream to make a difference in my community. Can you believe it? Feels like a dream come true!", "speaker": "John"}, {"value": "veterans support petition project", "date": "2023-05-20", "span": "Been real busy tackling a project to support military veterans", "turn": "Hey Maria, how's it going? Been real busy tackling a project to support military veterans. Trying to get a petition going, it's pretty rewarding but kinda stressful. How are you?", "speaker": "John"}]}, {"id": "chain07-conv-43", "conv": "conv-43", "speaker": "tim", "slot": "job", "elements": [{"value": "joined fantasy literature forum", "date": "2023-06-15", "span": "Last night I joined a fantasy literature forum", "turn": "Last night I joined a fantasy literature forum and had a great talk about my fave books. It was so enriching!", "speaker": "Tim"}, {"value": "writing articles for online magazine", "date": "2023-08-02", "span": "I'm writing articles about fantasy novels for an online mag", "turn": "Hey John! How've you been? Something awesome happened - I'm writing articles about fantasy novels for an online mag. It's so rewarding!", "speaker": "Tim"}, {"value": "writing more articles", "date": "2023-08-11", "span": "I have been writing more articles", "turn": "I can just imagine the thrill of being in that kind of atmosphere. Must've been an amazing experience for you! BTW, I have been writing more articles - it lets me combine my love for reading and the joy of sharing great stories. Here's my latest one!", "speaker": "Tim"}, {"value": "writing a fantasy novel", "date": "2023-10-21", "span": "I'm in the middle of fantasy novel", "turn": "That castle looks amazing! I hope I get to visit it someday. My writing is going well: I'm in the middle of fantasy novel and it's a bit nerve-wracking but so exciting! All my hard work is paying off. Writing brings such joy and it's incredible how it can create a whole new world. Thanks so much for believing in me!", "speaker": "Tim"}, {"value": "stuck on a plot twist", "date": "2023-11-06", "span": "Last week, I had a huge writing issue - got stuck on a plot twist", "turn": "Hey John, long time no see! Hope you've been doing well. Since we last chat, some stuff's happened. Last week, I had a huge writing issue - got stuck on a plot twist and couldn't find my way out. It was crazy frustrating, but I kept pushing and eventually got the ideas flowing again.", "speaker": "Tim"}, {"value": "story based on UK experiences didn't work out", "date": "2023-11-21", "span": "I tried writing a story based on my experiences in the UK, but it didn't go the way I wanted", "turn": "I've been swamped with studies and projects, but last week I had a setback. I tried writing a story based on my experiences in the UK, but it didn't go the way I wanted. It's been tough, do you have any advice for getting better with storytelling?", "speaker": "Tim"}]}, {"id": "chain08-conv-47", "conv": "conv-47", "speaker": "james", "slot": "pet", "elements": [{"value": "two dogs: Max and Daisy", "date": "2022-03-17", "span": "Max and Daisy", "turn": "Max and Daisy. Will be actually cool to build an app for dog walking and pet care. The goal is to connect pet owners with reliable dog walkers inally owning a luxury car was a dream come true and I'm so stoked.", "speaker": "Calvin"}, {"value": "car damaged in accident", "date": "2023-06-21", "span": "I had a lil car accident last Friday", "turn": "Hi Dave! Nice to hear from you. Since last chat, some things have happened. I had a lil car accident last Friday, kinda upsetting but no one was hurt. I've been dealing with insurance and repairs - taking up a lot of time and energy. Look at this photo!", "speaker": "Calvin"}, {"value": "car repaired and running", "date": "2023-07-07", "span": "the car's fixed and going strong", "turn": "Hey Dave! Thanks for checking in. It's all good now, the car's fixed and going strong. Nothing better than cruising around - it's the best! Look at how my car looks right now. How've you been? Anything new?", "speaker": "Calvin"}, {"value": "Ferrari serviced", "date": "2023-08-03", "span": "I just took my Ferrari for a service", "turn": "Hey Dave, long time no see! I just took my Ferrari for a service and it was so stressful. I'm kinda attached to it. Can you relate? What kind of hobbies give you a feeling of being restored?", "speaker": "Calvin"}, {"value": "Ferrari", "date": "2023-10-15", "span": "I got a new Ferrari", "turn": "C'mon, remember how great you are! Keep going for those dreams. You got this! You know what Dave? Last week, I got a new Ferrari! It's a masterpiece on wheels. Excited for thrilling rides and unforgettable journeys! Perhaps a photo of this unique beauty will lift your mood.", "speaker": "Calvin"}]}, {"id": "chain11-conv-26", "conv": "conv-26", "speaker": "caroline", "slot": "adoption_process", "elements": [{"value": "researching adoption agencies", "date": "2023-05-25", "span": "Researching adoption agencies", "turn": "Researching adoption agencies — it's been a dream to have a family and give a loving home to kids who need it.", "speaker": "Caroline"}, {"value": "chose an LGBTQ+ friendly agency", "date": "2023-05-25", "span": "I chose them 'cause they enplay to a film contest just to see how others might like it!", "speaker": "Joanna"}, {"value": "started writing a book", "date": "2022-07-10", "span": "I actually started on a book recently", "turn": "I will! I actually started on a book recently since my movie did well!", "speaker": "Joanna"}]}, {"id": "chain15-conv-43", "conv": "conv-43", "speaker": "john", "slot": "endorsement_deals", "elements": [{"value": "exploring endorsements", "date": "2023-06-15", "span": "I'm exploring endorsement opportunities", "turn": "Wow, great to hear that you had a blast talking books! It's cool to connect with others who share your passion. On a different note, exciting things are happening--I'm exploring endorsement opportunities. Thinking about the possibilities pumps me up. It would be amazing to work with brands and do something special. It's so rewarding to have my hard work pay off like this.", "speaker": "John"}, {"value": "considering Nike and Under Armour", "date": "2023-06-15", "span": "I'm currently considering sports brands like Nike and Under Armour", "turn": "Thanks! I'm really excited about this new journey! I'm currently considering sports brands like Nike and Under Armour. It would be great to collaborate with brands that are related to sports. However, I'm also open to exploring other brands that align with my values and interests. There are so many options out there, and I can't wait to see where this takes me!", "speaker": "John"}, {"value": "talks with big names", "date": "2023-07-16", "span": "I'm getting somewhere with endorsements. I've talked to some big names", "turn": "Yeah, I'm getting somewhere with endorsements. I've talked to some big names, which looks promising. Exciting to see what's in store!", "speaker": "John"}, {"value": "signed Nike deal, in talks with Gatorade", "date": "2023-07-16", "span": "I just signed up Nike for a basketball shoe and gear deal. I'm also in talks with Gatorade about a potential sponsorship.", "turn": "I just signed up Nike for a basketball shoe and gear deal. I'm also in talks with Gatorade about a potential sponsorship. It's pretty cool to be working with such big brands!", "speaker": "John"}, {"value": "looking into more endorsements", "date": "2023-09-21", "span": "Off the court, I'm also looking into more endorsements", "turn": "Definitely! I'm focusing on better shooting and making more of an impact on the court. I want to be known as a consistent performer and help my team. Off the court, I'm also looking into more endorsements and building my brand. It's important for me to think about life after basketball.", "speaker": "John"}]}, {"id": "chain16-conv-26", "conv": "conv-26", "speaker": "caroline", "slot": "activist_group_membership", "elements": [{"value": "member of a new LGBTQ activist group", "date": "2023-07-20", "span": "I just joined a new LGBTQ activist group last Tues", "turn": "Hey Mel! A lot's happened since we last chatted - I just joined a new LGBTQ activist group last Tues. I'm meeting so many cool people who are as passionate as I am about rights and community support. I'm giving my voice and making a real difference, plus it's fulfilling in so many ways. It's just great, you know?", "speaker": "Caroline"}]}, {"id": "chain17-conv-26", "conv": "conv-26", "speaker": "melanie", "slot": "figurine_collection", "elements": [{"value": "newly bought figurines", "date": "2023-10-22", "span": "These figurines I bought yesterday", "turn": "Congrats, Caroline! Adoption sounds awesome. I'm so happy for you. These figurines I bought yesterday remind me of family love. Tell me, what's your vision for the future?", "speaker": "Melanie"}]}, {"id": "chain18-conv-41", "conv": "conv-41", "speaker": "john", "slot": "fitness_class", "elements": [{"value": "weekend yoga class", "date": "2023-04-07", "span": "I started a weekend yoga class with a colleague", "turn": "Hey Maria, I'm so excited to tell you I started a weekend yoga class with a colleague - it's awesome! I feel great, both mentally and physically after each session. I'd been wanting to try yoga for a while and finally took the plunge. Simple stretching and breathing is having such a positive effect on my wellbeing. And the instructor is great too.", "speaker": "John"}]}, {"id": "chain19-conv-41", "conv": "conv-41", "speaker": "john", "slot": "volunteering", "elements": [{"value": "fire-fighting brigade member", "date": "2023-07-31", "span": "I just joined a fire-fighting brigade", "turn": "Hey Maria, that's awesome! I'm really inspired by your drive to make a difference. You mentioned your work at the homeless shelter last time and it made me think of how I could help too, so I just joined a fire-fighting brigade. It's such a great feeling to do something to give back to my community!", "speaker": "John"}]}];
let res={};
try{res=JSON.parse(localStorage.getItem("locomo_spot")||"{}")}catch(e){}
function persist(){try{localStorage.setItem("locomo_spot",JSON.stringify(res))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function hl(turn,span){
 const i=turn.indexOf(span);
 if(i<0) return esc(turn);
 return esc(turn.slice(0,i))+"<mark>"+esc(span)+"</mark>"+esc(turn.slice(i+span.length));
}
function render(){
 const L=document.getElementById("list"); L.innerHTML="";
 ITEMS.forEach(function(it,ix){
  const v=(res[it.id]||{}).v||"";
  const els=it.elements.map(function(e){
   return '<div class="el"><span class="d mono">'+e.date+'</span> <span class="v">'+esc(e.value)+
    '</span><div class="t">'+e.speaker+':“'+hl(e.turn,e.span)+'”</div></div>';}).join("");
  L.innerHTML+='<div class="card"><span class="chip">'+it.conv+'</span>'+
   '<span class="chip">'+esc(it.speaker)+'</span><span class="chip">'+esc(it.slot)+'</span>'+
   '<span class="mono" style="color:var(--muted);font-size:11px">'+it.id+'</span>'+els+
   '<div class="btns">'+
   '<button class="btn g'+(v==="good"?" sel":"")+'" onclick="mark(\''+it.id+'\',\'good\')">链正确 ✓</button>'+
   '<button class="btn p'+(v==="partial"?" sel":"")+'" onclick="mark(\''+it.id+'\',\'partial\')">部分正确</button>'+
   '<button class="btn b'+(v==="bad"?" sel":"")+'" onclick="mark(\''+it.id+'\',\'bad\')">错误 ✗</button></div>'+
   '<textarea rows="1" placeholder="备注(部分/错误时写一句)" oninput="note(\''+it.id+'\',this.value)">'+
   esc((res[it.id]||{}).note||"")+'</textarea></div>';
 });
 const dn=ITEMS.filter(function(x){return res[x.id]&&res[x.id].v}).length;
 L.innerHTML+='<div class="progress">已评 '+dn+' / '+ITEMS.length+'</div>';
}
function mark(id,v){res[id]=Object.assign(res[id]||{},{v:v});persist();render();}
function note(id,t){res[id]=Object.assign(res[id]||{},{note:t});persist();}
function finish(){
 const miss=ITEMS.filter(function(x){return !res[x.id]||!res[x.id].v}).length;
 if(miss>0&&!confirm("还有 "+miss+" 条未评,确定导出?"))return;
 const out={task:"locomo_chain_spotcheck",exported_at:new Date().toISOString(),
  ratings:ITEMS.map(function(x){return{id:x.id,verdict:(res[x.id]||{}).v||null,note:(res[x.id]||{}).note||""}})};
 document.getElementById("out").value=JSON.stringify(out,null,1);
 document.getElementById("export").style.display="block";
 document.getElementById("export").scrollIntoView({behavior:"smooth"});
}
function copyOut(){
 const t=document.getElementById("out");t.select();
 try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}
}
render();
</script>
