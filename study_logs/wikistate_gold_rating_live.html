.btn.agree.sel{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}

.btn.unsure.sel{border-color:var(--unsure);background:var(--unsure-soft);color:var(--unsure)}
.key{font-size:11px;color:var(--muted);font-weight:400;display:block}

.stat{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}

.stat div span{font-size:12px;color:var(--muted)}
.bar{height:16px;border-radius:4px;display:flex;overflow:hidden;min-width:110px}

.msg{margin-top:10px;font-size:13px;padding:8px 12px;border-radius:8px}

.msg.warn{background:var(--unsure-soft);color:var(--unsure)}

"Power Plate-Bik", "slot": "team", "chain": [{"date": "2001-00-00", "value": "Power Plate-Bik", "span": "I've signed with Power Plate-Bik, so that's my new team from now on"}, {"date": "2005-00-00", "value": "AA Drink-leontien.nl", "span": "I'm riding for AA Drink-leontien.nl this season"}, {"date": "2008-00-00", "value": "Liv Racing TeqFind", "span": "Liv Racing TeqFind is now my new team"}]}], "conv": {"longest_tenure": "约定:任期 = 相邻两次起始日之差(闭区间);最后一段到 Today 为止长度记 0。同值多段累加。", "change_count": "约定:每一次链上转移记一次变更;变更次数 = 链长 − 1。", "count_before": "约定:数的是该日期之前(严格早于)出现过的不同值的个数。", "first_vs_last": "约定:first = 链上第一个值;most recent = 链上最后一个值。"}, "subs": []}</script><script id="app">
var S = JSON.parse(document.getElementById('data').textContent);
var CONV = S.conv, ITEMS = S.items;
var me = {name:'', marks:{}, notes:{}, i:0};
var tab = S.subs.length ? 'results' : 'rate';
var started = false, sending = false, roMode = false;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function buildDoc(state){

function renderRate(){

      '<p style="margin:8px 0 0;font-size:13.5px">\u6a21\u578b\u5728\u8fd9\u4e24\u5904\u7cfb\u7edf\u6027\u5730\u4e0d\u540c\u610f\u6211\u4eec\u7684\u53e3\u5f84\uff0c\u60f3\u8bf7\u4f60\u5224\u65ad<b>\u6211\u4eec\u7684\u7ea6\u5b9a\u662f\u5426\u7ad9\u5f97\u4f4f</b>\uff1a</p>' +
      '<p style="margin:6px 0 0;font-size:13.5px">\u2460 <b>\u53d8\u66f4\u6b21\u6570</b>\uff1a\u94fe\u4e0a 4 \u4e2a\u96c7\u4e3b\uff0c\u6211\u4eec\u8bb0 <b>3</b> \u6b21\u53d8\u66f4\uff08\u521d\u6b21\u4efb\u804c\u4e0d\u7b97\uff09\u3002\u8be5\u8bb0 3 \u8fd8\u662f 4\uff1f</p>' +

      '<p style="margin:8px 0 0;font-size:12.5px;color:var(--muted)">\u4e0d\u540c\u610f\u5c31\u70b9\u300c\u4e0d\u4e00\u81f4\u300d\u5e76\u5728\u5907\u6ce8\u91cc\u5199\u4e00\u53e5\u2014\u2014\u8fd9\u6b63\u662f\u6211\u4eec\u6700\u9700\u8981\u7684\u53cd\u9988\u3002</p></div>' +
      '<div class="card"><label>\u4f60\u7684\u79f0\u547c\uff08\u5199\u8fdb\u7ed3\u679c\u91cc\uff09\uff1a</label>' +
      '<input id="rater" placeholder="\u4f8b\u5982\uff1a\u5c0f\u738b" onkeydown="if(event.key===\'Enter\')start()"/>' +
      '<div class="nav"><button class="primary" onclick="start()">\u5f00\u59cb\u6253\u5206</button></div></div>';
  }
  var it = ITEMS[me.i], done = Object.keys(me.marks).length;
  var h = '<div class="progress"><div style="width:' + (done/ITEMS.length*100) + '%"></div></div>' +
    '<div class="meta"><span>\u7b2c ' + (me.i+1) + ' / ' + ITEMS.length + ' \u9898</span><span>\u5df2\u5b8c\u6210 ' + done + '</span></div>' +
    '<div class="card"><span class="chip">' + esc(it.type) + '</span>' +
    '<span class="mono" style="color:var(--muted);font-size:12px">' + esc(it.id) + '</span>' +
    '<div class="q">' + esc(it.q) + '</div>' +
    '<div class="gold">\u6807\u51c6\u7b54\u6848\uff1a<b>' + esc(it.gold) + '</b></div>' +
    '<div class="conv">' + esc(CONV[it.type] || '') + '</div>' +
    '<table><thead><tr><th style="width:104px">\u65e5\u671f</th><th style="width:190px">\u503c</th><th>\u5bf9\u8bdd\u539f\u53e5\uff08\u951a\u70b9\uff09</th></tr></thead><tbody>';
  for (var k = 0; k < it.chain.length; k++) {
    var c = it.chain[k];

  }
  h += '</tbody></table></div>';
  var m = me.marks[it.id];
  h += '<div class="btns">' +
    '<button class="btn agree' + (m==='agree'?' sel':'') + '" onclick="mark(\'agree\')">\u4e00\u81f4 \u2713<span class="key">\u6309 1</span></button>' +
    '<button class="btn disagree' + (m==='disagree'?' sel':'') + '" onclick="mark(\'disagree\')">\u4e0d\u4e00\u81f4 \u2717<span class="key">\u6309 2</span></button>' +
    '<button class="btn unsure' + (m==='unsure'?' sel':'') + '" onclick="mark(\'unsure\')">\u4e0d\u786e\u5b9a \uff1f<span class="key">\u6309 3</span></button></div>' +
    '<div class="card"><label style="font-size:13px;color:var(--muted)">\u5907\u6ce8\uff08\u5c24\u5176\u300c\u4e0d\u4e00\u81f4\u300d\u65f6\u5199\u4e00\u53e5\u4e3a\u4ec0\u4e48\uff09\uff1a</label>' +
    '<textarea id="note" rows="2" oninput="saveNote()"></textarea></div>' +
    '<div class="nav"><button onclick="go(-1)">\u2190 \u4e0a\u4e00\u9898</button><button onclick="go(1)">\u4e0b\u4e00\u9898 \u2192</button>' +
    '<button class="primary" onclick="submit()"' + (sending?' disabled':'') + '>' +
    (sending ? '\u63d0\u4ea4\u4e2d\u2026' : '\u63d0\u4ea4\u7ed3\u679c\uff08\u5df2\u5b8c\u6210 ' + done + '/' + ITEMS.length + '\uff09') + '</button></div>' +
    '<div id="msg"></div>';

function renderResults(){
  var subs = S.subs;
  if (!subs.length) return '<div class="card"><p class="sub">\u8fd8\u6ca1\u6709\u4eba\u63d0\u4ea4\u3002\u8bc4\u5206\u5b8c\u6210\u540e\u7ed3\u679c\u4f1a\u81ea\u52a8\u51fa\u73b0\u5728\u8fd9\u91cc\u3002</p></div>';
  var tot=0, ag=0, dis=0, un=0;
  for (var i=0;i<subs.length;i++){var mk=subs[i].marks;
    for (var k in mk){tot++; if(mk[k]==='agree')ag++; else if(mk[k]==='disagree')dis++; else un++;}}
  var h = '<div class="card"><div class="stat">' +
    '<div><b>' + subs.length + '</b><span>\u8bc4\u5206\u4eba</span></div>' +
    '<div><b>' + (tot?(ag/tot*100).toFixed(1):'0') + '%</b><span>\u4e00\u81f4\u7387</span></div>' +
    '<div><b>' + (tot?(dis/tot*100).toFixed(1):'0') + '%</b><span>\u4e0d\u4e00\u81f4</span></div>' +
    '<div><b>' + (tot?(un/tot*100).toFixed(1):'0') + '%</b><span>\u4e0d\u786e\u5b9a</span></div>' +
    '<div><b>' + tot + '</b><span>\u603b\u8bc4\u5224\u6570</span></div></div></div>';
  var byType = {};
  for (var i=0;i<subs.length;i++){var mk=subs[i].marks;
    for (var k in mk){var t=(ITEMS.filter(function(x){return x.id===k;})[0]||{}).type||'?';
      byType[t]=byType[t]||{a:0,d:0,u:0}; var b=byType[t];
      if(mk[k]==='agree')b.a++; else if(mk[k]==='disagree')b.d++; else b.u++;}}
  h += '<h2>\u6309\u9898\u578b</h2><div class="card"><table><thead><tr><th>\u9898\u578b</th><th style="width:88px">\u4e00\u81f4\u7387</th><th>\u5206\u5e03</th></tr></thead><tbody>';
  for (var t in byType){var b=byType[t], n=b.a+b.d+b.u;
    h += '<tr><td>' + esc(t) + '</td><td class="mono">' + (b.a/n*100).toFixed(1) + '%</td><td><div class="bar">' +
      '<i style="width:' + (b.a/n*100) + '%;background:var(--ok)"></i>' +
      '<i style="width:' + (b.d/n*100) + '%;background:var(--no)"></i>' +
      '<i style="width:' + (b.u/n*100) + '%;background:var(--unsure)"></i></div></td></tr>';}
  h += '</tbody></table></div>';
  var flagged = [];
  for (var j=0;j<ITEMS.length;j++){var it=ITEMS[j], d=0, n=0, notes=[];
    for (var i=0;i<subs.length;i++){var v=subs[i].marks[it.id];
      if(v){n++; if(v==='disagree'){d++; if(subs[i].notes[it.id])notes.push(subs[i].name+'\uff1a'+subs[i].notes[it.id]);}}}
    if(d) flagged.push({it:it,d:d,n:n,notes:notes});}
  flagged.sort(function(a,b){return b.d-a.d;});
  h += '<h2>\u88ab\u8d28\u7591\u7684\u9898\uff08' + flagged.length + '\uff09</h2>';
  if (!flagged.length) h += '<div class="card"><p class="sub">\u6ca1\u6709\u9898\u88ab\u6807\u4e3a\u4e0d\u4e00\u81f4\u3002</p></div>';
  for (var j=0;j<flagged.length && j<25;j++){var f=flagged[j];
    h += '<div class="card"><span class="chip">' + esc(f.it.type) + '</span>' +
      '<span class="mono" style="color:var(--no);font-size:12.5px">' + f.d + '/' + f.n + ' \u4eba\u8ba4\u4e3a\u4e0d\u4e00\u81f4</span>' +
      '<div class="q" style="font-size:15px">' + esc(f.it.q) + '</div>' +
      '<div class="gold">\u6807\u51c6\u7b54\u6848\uff1a<b>' + esc(f.it.gold) + '</b></div>';
    for (var z=0;z<f.notes.length;z++) h += '<div class="conv">' + esc(f.notes[z]) + '</div>';
    h += '</div>';}
  h += '<h2>\u8bc4\u5206\u4eba</h2><div class="card"><table><thead><tr><th>\u79f0\u547c</th><th>\u5b8c\u6210</th><th>\u4e00\u81f4</th><th>\u4e0d\u4e00\u81f4</th><th>\u4e0d\u786e\u5b9a</th></tr></thead><tbody>';
  for (var i=0;i<subs.length;i++){var s=subs[i], a=0,d=0,u=0;
    for (var k in s.marks){if(s.marks[k]==='agree')a++;else if(s.marks[k]==='disagree')d++;else u++;}
    h += '<tr><td>' + esc(s.name) + '</td><td class="mono">' + (a+d+u) + '</td><td class="mono">' + a + '</td><td class="mono">' + d + '</td><td class="mono">' + u + '</td></tr>';}
  h += '</tbody></table></div>';
  return h;
}

function setTab(t){tab=t;render();}
function start(){var v=(document.getElementById('rater')||{}).value||'';
  if(!v.trim()){alert('\u8bf7\u5148\u5199\u4e00\u4e0b\u79f0\u547c');return;}
  me.name=v.trim(); started=true; render();}
function mark(v){me.marks[ITEMS[me.i].id]=v; if(me.i<ITEMS.length-1)me.i++; render();}
function saveNote(){me.notes[ITEMS[me.i].id]=document.getElementById('note').value;}
function go(d){var n=me.i+d; if(n>=0&&n<ITEMS.length){me.i=n;render();}}
function msg(cls,text){var m=document.getElementById('msg');
  if(m) m.innerHTML='<div class="msg ' + cls + '">' + esc(text) + '</div>';}

function submit(){
  var done=Object.keys(me.marks).length;
  if(!done){msg('warn','\u8fd8\u6ca1\u6709\u6253\u4efb\u4f55\u4e00\u9898\u3002');return;}
  if(done<ITEMS.length && !confirm('\u53ea\u5b8c\u6210\u4e86 '+done+'/'+ITEMS.length+' \u9898\uff0c\u786e\u8ba4\u63d0\u4ea4\uff1f'))return;
  sending=true; render(); msg('warn','\u6b63\u5728\u63d0\u4ea4\u2026');
  var sub={name:me.name,marks:me.marks,notes:me.notes,n:done};
  try{sessionStorage.setItem('wsrate_pending',JSON.stringify(sub));}catch(e){}
  claude.use('artifact').then(function(a){
    if(!a){sending=false;roMode=true;render();
      msg('err','\u6b64\u9875\u9762\u672a\u542f\u7528\u4fdd\u5b58\u80fd\u529b\uff0c\u65e0\u6cd5\u63d0\u4ea4\u3002');return;}
    var next=JSON.parse(JSON.stringify(S)); next.subs.push(sub);
    return a.publish(buildDoc(next)).then(function(){
      try{sessionStorage.removeItem('wsrate_pending');}catch(e){}
    });
  }).catch(function(e){
    sending=false;
    var code=(e&&e.code)||'upstream_error';
    if(code==='conflict'){msg('warn','\u522b\u4eba\u521a\u597d\u540c\u65f6\u63d0\u4ea4\u4e86\uff0c\u9875\u9762\u5c06\u5237\u65b0\u2014\u2014\u4f60\u7684\u7b54\u6848\u5df2\u6682\u5b58\uff0c\u5237\u65b0\u540e\u70b9\u201c\u91cd\u65b0\u63d0\u4ea4\u201d\u5373\u53ef\u3002');}
    else if(code==='not_writer'||code==='not_granted'||code==='consent_required'){
      roMode=true;render();
      msg('err','\u4f60\u5f53\u524d\u662f\u53ea\u8bfb\u8bbf\u95ee\uff0c\u65e0\u6cd5\u5199\u5165\u3002\u8bf7\u8ba9\u5206\u4eab\u4eba\u628a\u94fe\u63a5\u6539\u4e3a\u201c\u53ef\u7f16\u8f91\u201d\u540e\u91cd\u8bd5\u3002');}
    else if(code==='rate_limited'){msg('warn','\u63d0\u4ea4\u592a\u9891\u7e41\uff0c\u7a0d\u7b49\u51e0\u79d2\u518d\u8bd5\u3002');}
    else{msg('err','\u63d0\u4ea4\u5931\u8d25\uff08'+code+'\uff09\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5\u3002');}
    render();
  });
}

document.addEventListener('keydown',function(e){
  if(tab!=='rate'||!started)return;
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(e.key==='1')mark('agree'); else if(e.key==='2')mark('disagree');
  else if(e.key==='3')mark('unsure');
  else if(e.key==='ArrowLeft')go(-1); else if(e.key==='ArrowRight')go(1);
});

(function(){
